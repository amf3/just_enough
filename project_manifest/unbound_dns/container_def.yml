version: 1

input:
  backend: buildroot
  path: /home/ubuntu/just_enough/staging

binaries:
  - BUILDROOT/usr/sbin/unbound:/usr/sbin/unbound
  - BUILDROOT/usr/sbin/unbound-anchor:/usr/sbin/unbound-anchor
  - BUILDROOT/usr/sbin/unbound-checkconf:/usr/sbin/unbound-checkconf
  - BUILDROOT/usr/sbin/unbound-control:/usr/sbin/unbound-control
  - BUILDROOT/usr/sbin/unbound-host:/usr/sbin/unbound-host

data:
  - BUILDROOT/usr/lib/libz.so.1:/lib/libz.so.1
  - BUILDROOT/etc/ssl/openssl.cnf:/etc/ssl/openssl.cnf
  - ./project_manifest/unbound_dns/passwd:/etc/passwd
  - ./project_manifest/unbound_dns/group:/etc/group
  - ./project_manifest/unbound_dns/nsswitch.conf:/etc/nsswitch.conf
  - ./project_manifest/unbound_dns/unbound.conf:/etc/unbound/unbound.conf

directories:
  - /etc/ssl
  - /etc/unbound
  - /var/cache/unbound
  - /var/run

symlinks: 
  - /usr/bin:/bin
  - /usr/sbin:/sbin
  - /lib:/lib64
  - /lib:/usr/lib
  - /lib/libz.so.1:/lib/libz.so
