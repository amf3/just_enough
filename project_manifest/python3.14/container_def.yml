version: 1

input:
  backend: buildroot
  path: /app/staging

binaries:
  - BUILDROOT/usr/bin/python3.14:/usr/bin/python3.14
  - BUILDROOT/usr/lib/libz.so:/usr/lib/libz.so
  - BUILDROOT/usr/lib/libexpat.so:/usr/lib/libexpat.so
  - BUILDROOT/usr/lib/libffi.so:/usr/lib/libffi.so
  - BUILDROOT/usr/lib/libssl.so:/usr/lib/libssl.so
  - BUILDROOT/usr/lib/libcrypto.so:/usr/lib/libcrypto.so
  
data:
  - ./project_manifest/busybox/passwd:/etc/passwd
  - ./project_manifest/busybox/group:/etc/group
  - BUILDROOT/usr/bin/pip3:/usr/bin/pip3
  - BUILDROOT/usr/lib/python3.14:/usr/lib/python3.14
  - BUILDROOT/usr/lib/libgcc_s.so:/usr/lib/libgcc_s.so
  - BUILDROOT/usr/lib/libgcc_s.so.1:/usr/lib/libgcc_s.so.1
  - BUILDROOT/usr/lib/librt.so.1:/usr/lib/librt.so.1
  - BUILDROOT/usr/lib/libpthread.so.0:/usr/lib/libpthread.so.0
  - BUILDROOT/usr/lib/libdl.so.2:/usr/lib/libdl.so.2

directories:
  - /usr/sbin
  - /home/nobody
  - /root
  - /etc

symlinks:
  - /usr/bin:/bin
  - /usr/sbin:/sbin
  - /usr/lib:/lib
  - /lib:/lib64