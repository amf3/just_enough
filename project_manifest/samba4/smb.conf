[global]
   # Basic Identification
   workgroup = WORKGROUP
   server string = JustEnough Samba Appliance
   server role = standalone server
   security = user

   # Protocol & Security Hardening
   server min protocol = SMB2
   guest account = nobody
   map to guest = Never

   # Disable Unnecessary Subsystems
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Container Logging
   log level = 1
   logging = stdout