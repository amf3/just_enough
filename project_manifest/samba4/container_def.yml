version: 1

input:
  backend: buildroot
  path: /home/ubuntu/just_enough/staging

binaries:
  - BUILDROOT/usr/bin/smbd:/usr/bin/smbd
  - BUILDROOT/usr/bin/smbpasswd:/usr/bin/smbpasswd
  - BUILDROOT/usr/bin/smbclient:/usr/bin/smbclient
  - BUILDROOT/usr/libexec/samba/samba-dcerpcd:/usr/libexec/samba/samba-dcerpcd
  - BUILDROOT/usr/libexec/samba/rpcd_winreg:/usr/libexec/samba/rpcd_winreg
  - BUILDROOT/usr/libexec/samba/rpcd_classic:/usr/libexec/samba/rpcd_classic

data:
  - ./project_manifest/samba4/passwd:/etc/passwd
  - ./project_manifest/samba4/group:/etc/group
  - BUILDROOT/usr/lib/samba/vfs:/usr/lib/samba/vfs
  - BUILDROOT/usr/lib/samba/idmap:/usr/lib/samba/idmap
  - BUILDROOT/usr/lib/samba/krb5:/usr/lib/samba/krb5
  - BUILDROOT/usr/lib/samba/ldb:/usr/lib/samba/ldb
  - BUILDROOT/usr/lib/samba/nss_info:/usr/lib/samba/nss_info

directories:
  - /usr/sbin
  - /etc/samba
  - /home/nobody
  - /root
  - /etc
  - /tmp
  - /srv/timemachine
  - /srv/mydata
  - /var/log/samba
  - /var/lib/samba/private
  - /var/run/samba
  - /var/cache/samba
  - /var/lock/samba

symlinks:
  - /usr/bin:/bin
  - /usr/sbin:/sbin
  - /usr/lib:/lib
  - /lib:/lib64
