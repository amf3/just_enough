name: Build Appliances 2

on:
  workflow_dispatch:
    inputs:
      buildroot_tag:
        description: 'Kitchen Sink Tag to consume'
        required: true
        default: '2026.02.1'
  workflow_run:
    workflows: ["Build Kitchen Sink RootFS"]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-appliance:
    name: Build ${{ matrix.appliance }}
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        appliance: [unbound_dns]

    env:
      BR_TAG: ${{ github.event.inputs.buildroot_tag || '2026.02.1' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pax-utils python3-yaml bpftrace

      - name: Install ORAS
        run: |
          curl -LO https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_amd64.tar.gz
          mkdir -p oras-install && tar -zxf oras_1.3.2_linux_amd64.tar.gz -C oras-install
          sudo cp oras-install/oras /usr/local/bin/

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and Pull Kitchen Sink RootFS
        run: |
          gh attestation verify oci://ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }} \
            --repo ${{ github.repository }}
          mkdir -p /tmp/kitchen-sink
          cd /tmp/kitchen-sink
          oras pull ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }}

      - name: Run Assembly Script
        env:
          BUILDROOT: /tmp/rootfs-extracted
          SYSROOT: /tmp/rootfs-extracted
        run: |
          mkdir -p project_manifest/${{ matrix.appliance }}/staging
          mkdir -p /tmp/rootfs-extracted
          tar -xjf /tmp/kitchen-sink/rootfs.tar.bz2 -C /tmp/rootfs-extracted
          python3 project_manifest/tools/assemble.py \
            project_manifest/${{ matrix.appliance }}/container_def.yml \
            project_manifest/${{ matrix.appliance }}/staging

      - name: Generate Appliance SBOM
        shell: python
        run: |
          import csv
          import os
          import sys

          # Define paths
          master_sbom = "/tmp/kitchen-sink/sbom.csv"
          manifest = "project_manifest/${{ matrix.appliance }}/container_def.yml"
          appliance_sbom = "project_manifest/${{ matrix.appliance }}/staging/sbom.csv"

          # Ensure output staging directory exists
          os.makedirs(os.path.dirname(appliance_sbom), exist_ok=True)

          # Read the container manifest to use as a lookup index
          with open(manifest, "r") as f:
              manifest_content = f.read()

          # Process the CSV safely with native parsing
          with open(master_sbom, "r", newline="") as infile, \
               open(appliance_sbom, "w", newline="") as outfile:
              
              reader = csv.reader(infile)
              # CRITICAL FIX: Force Unix-style line endings (\n)
              writer = csv.writer(outfile, lineterminator='\n')
              
              # Pull and write the exact header layout
              header = next(reader)
              writer.writerow(header)
              
              # Fast, single-pass matching
              for row in reader:
                  if row:
                      package_name = row[0]
                      if package_name in manifest_content:
                          writer.writerow(row)

          # STDOUT PRINT BLOCK: Logs the generated SBOM directly to the CI output
          print("\n" + "="*40)
          print(f" GENERATED SBOM FOR: {os.path.basename(os.path.dirname(appliance_sbom))}")
          print("="*40)
          with open(appliance_sbom, "r") as f:
              sys.stdout.write(f.read())
          print("="*40 + "\n")

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── BUILD (local only, no push) ─────────────────────────────────────
      - name: Build Appliance Container
        id: build
        uses: docker/build-push-action@v7
        with:
          context: project_manifest/${{ matrix.appliance }}
          file: project_manifest/${{ matrix.appliance }}/Dockerfile
          push: false        # ← local only
          load: true         # ← loads into local docker daemon
          build-args: |
            STAGING_DIR=staging
            BR_TAG=${{ env.BR_TAG }}
          tags: |
            validate-target:${{ matrix.appliance }}

      # ── VALIDATE ────────────────────────────────────────────────────────
      - name: Install eBPF Hook Scripts
        run: |
          sudo cp project_manifest/tools/attach-ebpf-probe /usr/local/bin/
          sudo cp project_manifest/tools/detach-ebpf-probe /usr/local/bin/
          sudo chmod +x /usr/local/bin/attach-ebpf-probe
          sudo chmod +x /usr/local/bin/detach-ebpf-probe
          sudo mkdir -p /var/run/ebpf-hooks
          sudo chmod 700 /var/run/ebpf-hooks
          sudo touch /var/log/ebpf-container-trace.log
          sudo chmod 666 /var/log/ebpf-container-trace.log

      - name: Build OCI Bundle from Image
        run: |
          sudo python3 project_manifest/tools/build-oci-bundle.py \
            validate-target:${{ matrix.appliance }} \
            /tmp/oci-bundle

      - name: Run Container via runc
        run: |
          CONTAINER_ID=validate-${{ matrix.appliance }}-${{ github.run_id }}

          # Run in background — unbound is a daemon and never self-exits
          sudo runc run --bundle /tmp/oci-bundle $CONTAINER_ID &
          RUNC_PID=$!

          # Allow enough time for full startup sequence and eBPF trace capture
          echo "Waiting 15s for container startup sequence..."
          sleep 15

          # Graceful shutdown — gives unbound time to flush
          echo "Sending SIGTERM to container..."
          sudo runc kill $CONTAINER_ID SIGTERM || true
          wait $RUNC_PID || true

          # Clean up runc state
          sudo runc delete $CONTAINER_ID 2>/dev/null || true
          echo "Container validation complete"


      - name: Generate Dependency Report
        run: |
          python3 ci/hooks/generate-report.py \
            --log /var/log/ebpf-container-trace.log \
            --manifest project_manifest/${{ matrix.appliance }}/container_def.yml \
            --no-color
        # Exit code 1 if undeclared dependencies found — blocks push step

