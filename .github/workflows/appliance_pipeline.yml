name: Build Appliances

on:
  workflow_dispatch:
    inputs:
      buildroot_tag:
        description: 'Kitchen Sink Tag to consume'
        required: true
        default: '2026.02.1'
  # Optional: Automatically trigger this whenever the kitchen sink workflow succeeds
  workflow_run:
    workflows: ["Build Kitchen Sink RootFS"]
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-appliance:
    name: Build ${{ matrix.appliance }}
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    strategy:
      fail-fast: false
      matrix:
        appliance: [unbound_dns] # Add future appliances here

    env:
      BR_TAG: ${{ github.event.inputs.buildroot_tag || '2026.02.1' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pax-utils python3-yaml

      - name: Install ORAS
        run: |
          curl -LO https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_amd64.tar.gz
          mkdir -p oras-install && tar -zxf oras_1.3.2_linux_amd64.tar.gz -C oras-install
          sudo cp oras-install/oras /usr/local/bin/

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and Pull Kitchen Sink RootFS
        run: |
          # 1. Verify the birth certificate we made earlier
          gh attestation verify oci://ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }} \
            --repo ${{ github.repository }}
          
          # 2. Pull the layers into a temporary directory
          mkdir -p /tmp/kitchen-sink
          cd /tmp/kitchen-sink
          oras pull ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }}


      - name: Run Assembly Script
        env:
          # Set the environment variable your script explicitly checks for
          BUILDROOT: /tmp/rootfs-extracted
          # SYSROOT overrides the input.path for binaries/lddtree lookups
          SYSROOT: /tmp/rootfs-extracted
        run: |
          # Create the staging directory expected by your Dockerfile
          mkdir -p project_manifest/${{ matrix.appliance }}/staging
          
          # Extract the rootfs tarball pulled by ORAS
          mkdir -p /tmp/rootfs-extracted
          tar -xjf /tmp/kitchen-sink/rootfs.tar.bz2 -C /tmp/rootfs-extracted
          
          # Run the python assembler using strict positional arguments
          python3 project_manifest/tools/assemble.py \
            project_manifest/${{ matrix.appliance }}/unbound_container.yml \
            project_manifest/${{ matrix.appliance }}/staging

      - name: Generate Appliance SBOM
        run: |
          MASTER_SBOM="/tmp/kitchen-sink/sbom.csv"
          # TARGET THE STAGING DIR: This puts it right into the scratch rootfs
          APPLIANCE_SBOM="project_manifest/${{ matrix.appliance }}/staging/sbom.csv"
          
          echo '"PACKAGE","VERSION"' > $APPLIANCE_SBOM
          tail -n +2 "$MASTER_SBOM" | while IFS=, read -r package version; do
            clean_pkg=$(echo "$package" | tr -d '"')
            if grep -q "$clean_pkg" project_manifest/${{ matrix.appliance }}/unbound_container.yml; then
              echo "$package,$version" >> $APPLIANCE_SBOM
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Appliance Container
        id: build_push  
        uses: docker/build-push-action@v7
        with:
          # The context is the directory containing the Dockerfile
          context: project_manifest/${{ matrix.appliance }}
          file: project_manifest/${{ matrix.appliance }}/Dockerfile
          push: true
          provenance: false
          build-args: |
            STAGING_DIR=staging
            BR_TAG=${{ env.BR_TAG }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.appliance }}:${{ env.BR_TAG }}
            ghcr.io/${{ github.repository }}/${{ matrix.appliance }}:latest
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=A minimal JustEnough ${{ matrix.appliance }} appliance
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Appliance Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.appliance }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true




