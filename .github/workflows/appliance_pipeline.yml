name: Build Appliances

on:
  workflow_dispatch:
    inputs:
      buildroot_tag:
        description: 'Kitchen Sink Tag to consume'
        required: true
        default: '2026.05'
  # Optional: Automatically trigger this whenever the kitchen sink workflow succeeds
  workflow_run:
    workflows: ["Build Kitchen Sink RootFS"]
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-appliance:
    name: Build ${{ matrix.appliance }}
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    strategy:
      fail-fast: false
      matrix:
        appliance: [unbound_dns, busybox, python3.14] # Add future appliances here

    env:
      BR_TAG: ${{ github.event.inputs.buildroot_tag || '2026.05' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pax-utils python3-yaml
          # OWASP CycloneDX generator for Buildroot's manifest.csv format
          pip install --break-system-packages cyclonedx-buildroot

      - name: Install ORAS
        run: |
          curl -LO https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          mkdir -p oras-install && tar -zxf oras_1.3.3_linux_amd64.tar.gz -C oras-install
          sudo cp oras-install/oras /usr/local/bin/

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and Pull Kitchen Sink RootFS
        run: |
          # 1. Verify the birth certificate we made earlier
          gh attestation verify oci://ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }} \
            --repo ${{ github.repository }}
          
          # 2. Pull the layers into a temporary directory
          mkdir -p /tmp/kitchen-sink
          cd /tmp/kitchen-sink
          oras pull ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }}


      - name: Run Assembly Script
        env:
          # Set the environment variable your script explicitly checks for
          BUILDROOT: /tmp/rootfs-extracted
          # SYSROOT overrides the input.path for binaries/lddtree lookups
          SYSROOT: /tmp/rootfs-extracted
        run: |
          # Create the staging directory expected by your Dockerfile
          mkdir -p project_manifest/${{ matrix.appliance }}/staging
          
          # Extract the rootfs tarball pulled by ORAS
          mkdir -p /tmp/rootfs-extracted
          tar -xjf /tmp/kitchen-sink/rootfs.tar.bz2 -C /tmp/rootfs-extracted
          
          # Run the python assembler using strict positional arguments
          python3 project_manifest/tools/assemble.py \
            project_manifest/${{ matrix.appliance }}/container_def.yml \
            project_manifest/${{ matrix.appliance }}/staging

      - name: Filter Kitchen Sink Manifest
        shell: python
        run: |
          import csv
          import os

          # Define paths
          master_sbom = "/tmp/kitchen-sink/sbom.csv"
          manifest = "project_manifest/${{ matrix.appliance }}/container_def.yml"
          # Intermediate only - NOT staged into the image. cyclonedx-buildroot
          # consumes this and emits the real deliverable as CycloneDX JSON.
          filtered_csv = "/tmp/${{ matrix.appliance }}-filtered-manifest.csv"

          # Read the container manifest to use as a lookup index
          with open(manifest, "r") as f:
              manifest_content = f.read()

          # Process the CSV safely with native parsing
          with open(master_sbom, "r", newline="") as infile, \
               open(filtered_csv, "w", newline="") as outfile:

              reader = csv.reader(infile)
              # Force Unix-style line endings (\n)
              writer = csv.writer(outfile, lineterminator='\n')

              # Pull and write the exact header layout
              # (cyclonedx-buildroot expects: PACKAGE,VERSION,LICENSE,
              # LICENSE FILES,SOURCE ARCHIVE,SOURCE SITE,DEPENDENCIES WITH LICENSES)
              header = next(reader)
              writer.writerow(header)

              # Fast, single-pass matching
              for row in reader:
                  if row:
                      package_name = row[0]
                      if package_name in manifest_content:
                          writer.writerow(row)

      - name: Generate Appliance SBOM (CycloneDX JSON)
        run: |
          # This path assumes staging/ is COPYed as the image rootfs, so
          # staging/etc/sbom.json lands at /etc/sbom.json in the final image.
          # Adjust if your Dockerfile's COPY layout differs.
          SBOM_OUT="project_manifest/${{ matrix.appliance }}/staging/etc/sbom"
          mkdir -p "$(dirname "$SBOM_OUT")"

          cyclonedx-buildroot \
            -i "/tmp/${{ matrix.appliance }}-filtered-manifest.csv" \
            -o "$SBOM_OUT" \
            -n "just_enough-${{ matrix.appliance }}" \
            -v "${{ env.BR_TAG }}" \
            -m "just_enough"

          echo ""
          echo "========================================"
          echo " GENERATED CYCLONEDX SBOM FOR: ${{ matrix.appliance }}"
          echo "========================================"
          COMPONENT_COUNT=$(python3 -c "import json; print(len(json.load(open(\"${SBOM_OUT}.json\")).get('components', [])))")
          echo "Components: $COMPONENT_COUNT"
          python3 -m json.tool "${SBOM_OUT}.json"
          echo "========================================"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Appliance Container
        id: build_push  
        uses: docker/build-push-action@v7
        with:
          # The context is the directory containing the Dockerfile
          context: project_manifest/${{ matrix.appliance }}
          file: project_manifest/${{ matrix.appliance }}/Dockerfile
          push: true
          provenance: false
          build-args: |
            STAGING_DIR=staging
            BR_TAG=${{ env.BR_TAG }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.appliance }}:${{ env.BR_TAG }}
            ghcr.io/${{ github.repository }}/${{ matrix.appliance }}:latest
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=A minimal JustEnough ${{ matrix.appliance }} appliance
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Appliance Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.appliance }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true