name: Build Container Appliances

on:
  workflow_dispatch:
    inputs:
      buildroot_tag:
        description: 'Kitchen Sink Tag to consume'
        required: true
        default: '2026.05.1'
  workflow_run:
    workflows: ["Build Kitchen Sink RootFS"]
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-appliance:
    name: Build ${{ matrix.appliance }} (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    strategy:
      fail-fast: false
      matrix:
        appliance: [unbound_dns, busybox, python3.14]
        platform: [linux/amd64, linux/arm64]

    env:
      BR_TAG: ${{ github.event.inputs.buildroot_tag || '2026.05.1' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pax-utils python3-yaml

      - name: Install ORAS
        run: |
          curl -LO https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_amd64.tar.gz
          mkdir -p oras-install && tar -zxf oras_1.3.2_linux_amd64.tar.gz -C oras-install
          sudo cp oras-install/oras /usr/local/bin/

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and Pull Kitchen Sink RootFS
        run: |
          gh attestation verify oci://ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }} \
            --repo ${{ github.repository }}
          
          mkdir -p /tmp/kitchen-sink
          cd /tmp/kitchen-sink
          oras pull ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }}

      - name: Run Assembly Script
        env:
          BUILDROOT: /tmp/rootfs-extracted
          SYSROOT: /tmp/rootfs-extracted
        run: |
          mkdir -p project_manifest/${{ matrix.appliance }}/staging
          
          mkdir -p /tmp/rootfs-extracted
          tar -xjf /tmp/kitchen-sink/rootfs.tar.bz2 -C /tmp/rootfs-extracted
          
          python3 project_manifest/tools/assemble.py \
            project_manifest/${{ matrix.appliance }}/container_def.yml \
            project_manifest/${{ matrix.appliance }}/staging

      - name: Generate Appliance SBOM
        shell: python
        run: |
          import csv
          import os
          import sys

          master_sbom = "/tmp/kitchen-sink/sbom.csv"
          manifest = "project_manifest/${{ matrix.appliance }}/container_def.yml"
          appliance_sbom = "project_manifest/${{ matrix.appliance }}/staging/sbom.csv"

          os.makedirs(os.path.dirname(appliance_sbom), exist_ok=True)

          with open(manifest, "r") as f:
              manifest_content = f.read()

          with open(master_sbom, "r", newline="") as infile, \
               open(appliance_sbom, "w", newline="") as outfile:
              
              reader = csv.reader(infile)
              writer = csv.writer(outfile, lineterminator='\n')
              
              header = next(reader)
              writer.writerow(header)
              
              for row in reader:
                  if row:
                      package_name = row[0]
                      if package_name in manifest_content:
                          writer.writerow(row)

          print("\n" + "="*40)
          print(f" GENERATED SBOM FOR: {os.path.basename(os.path.dirname(appliance_sbom))}")
          print("="*40)
          with open(appliance_sbom, "r") as f:
              sys.stdout.write(f.read())
          print("="*40 + "\n")

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Appliance Container
        id: build_push  
        uses: docker/build-push-action@v7
        with:
          context: project_manifest/${{ matrix.appliance }}
          file: project_manifest/${{ matrix.appliance }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            STAGING_DIR=staging
            BR_TAG=${{ env.BR_TAG }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.appliance }}:${{ env.BR_TAG }}
            ghcr.io/${{ github.repository }}/${{ matrix.appliance }}:latest
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=A minimal JustEnough ${{ matrix.appliance }} appliance
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Appliance Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.appliance }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true