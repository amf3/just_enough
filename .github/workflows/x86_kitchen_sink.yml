name: X86 Kitchen Sink Build RootFS

on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'Buildroot Tag/Branch to checkout (e.g., 2026.02.1)'
        required: true
        default: 'master' # Buildroot's naming, not mine.

permissions:
  contents: read
  packages: write

# Defining these globally ensures they are available to all steps
env:
  BR2_EXTERNAL: ${{ github.workspace }}
  BR2_DL_DIR: ${{ github.workspace }}/.buildroot-dl

jobs:
  build-rootfs:
    name: Build x86_64 RootFS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Parent Repository
        uses: actions/checkout@v4
        with:
          # We check out submodules manually to control the version
          submodules: false 
          fetch-depth: 0

      - name: Initialize and Sync Buildroot Submodule
        run: |
          git submodule update --init
          cd buildroot
          git fetch --tags

          git checkout ${{ github.event.inputs.buildroot_tag }}
          echo "Buildroot is now at: $(git describe --tags)"

      - name: Install Buildroot Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
            bash bc binutils bzip2 cpio diffutils \
            file findutils g++ gcc git gzip libncurses-dev \
            make patch perl python3 rsync tar unzip wget \
            libcrypt-dev libcrypt-ssl

      - name: Cache Buildroot Downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.BR2_DL_DIR }}
          key: buildroot-dl-${{ hashFiles('**/Config.in', '**/external.desc') }}
          restore-keys: |
            buildroot-dl-

      - name: Build RootFS
        run: |
          mkdir -p ${{ env.BR2_DL_DIR }}
          make O=$PWD -C ./buildroot x86_container_defconfig
          time make O=$PWD -C ./buildroot source all

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push RootFS as OCI Artifact
        run: |
          # Install ORAS
          curl -LO https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_amd64.tar.gz
          mkdir -p oras-install && tar -zxf oras_1.3.2_linux_amd64.tar.gz -C oras-install
          
          # Push to GHCR
          ./oras-install/oras push ghcr.io/${{ github.repository }}/kitchen-sink:${{ github.event.inputs.build_tag }} \
            images/rootfs.tar.bz2:application/vnd.project.rootfs.layer.v1+tar+bz2

