name: Merge Kitchen Sink Multi-Arch Index

on:
  workflow_dispatch:
    inputs:
      buildroot_tag:
        description: 'Tag to merge (e.g., 2026.05)'
        required: true
        default: '2026.05'

permissions:
  packages: write
  id-token: write
  attestations: write

env:
  BR_TAG: ${{ github.event.inputs.buildroot_tag }}

jobs:
  merge-manifests:
    name: Create Multi-Arch Index
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        run: |
          curl -LO https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_amd64.tar.gz
          mkdir -p oras-install && tar -zxf oras_1.3.2_linux_amd64.tar.gz -C oras-install
          sudo cp oras-install/oras /usr/local/bin/

      - name: Generate Multi-Arch Index
        run: |
          REPO="ghcr.io/${{ github.repository }}/kitchen-sink"
          
          # Target unified tag
          TAG_UNIQUE="${REPO}:${BR_TAG}"
          
          # Source: the stable per-arch tags each build workflow publishes.
          # No commit SHA needed here — each arch workflow always keeps
          # its "<tag>-<arch>" alias pointed at its latest successful push,
          # so merge just picks up whatever's current for both arches.
          SRC_AMD64="${REPO}:${BR_TAG}-amd64"
          SRC_ARM64="${REPO}:${BR_TAG}-arm64"
          
          echo "Merging ${SRC_AMD64} and ${SRC_ARM64} into ${TAG_UNIQUE}"
          
          # Create OCI Image Index utilizing ORAS v1.3+ capabilities
          INDEX_OUTPUT=$(oras manifest index create "${TAG_UNIQUE}" "${SRC_AMD64}" "${SRC_ARM64}")
          echo "$INDEX_OUTPUT"

          # Explicitly grab the true index digest directly from the target tag
          DIGEST=$(oras manifest fetch "${TAG_UNIQUE}" | sha256sum | awk '{print $1}')
          echo "DIGEST=sha256:$DIGEST" >> $GITHUB_ENV

      - name: Attest Index Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/kitchen-sink
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true