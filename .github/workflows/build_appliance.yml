name: Build Appliances

on:
  workflow_dispatch:
    inputs:
      buildroot_tag:
        description: 'Kitchen Sink Tag to consume'
        required: true
        default: '2026.02.1'
  workflow_run:
    workflows: ["Build Kitchen Sink RootFS"]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-appliance:
    name: Build ${{ matrix.appliance }}
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        appliance: [unbound_dns]

    env:
      BR_TAG: ${{ github.event.inputs.buildroot_tag || '2026.02.1' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pax-utils python3-yaml bpftrace

      - name: Install ORAS
        run: |
          curl -LO https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_amd64.tar.gz
          mkdir -p oras-install && tar -zxf oras_1.3.2_linux_amd64.tar.gz -C oras-install
          sudo cp oras-install/oras /usr/local/bin/

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and Pull Kitchen Sink RootFS
        run: |
          gh attestation verify oci://ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }} \
            --repo ${{ github.repository }}
          mkdir -p /tmp/kitchen-sink
          cd /tmp/kitchen-sink
          oras pull ghcr.io/${{ github.repository }}/kitchen-sink:${{ env.BR_TAG }}

      - name: Run Assembly Script
        env:
          BUILDROOT: /tmp/rootfs-extracted
          SYSROOT: /tmp/rootfs-extracted
        run: |
          mkdir -p project_manifest/${{ matrix.appliance }}/staging
          mkdir -p /tmp/rootfs-extracted
          tar -xjf /tmp/kitchen-sink/rootfs.tar.bz2 -C /tmp/rootfs-extracted
          python3 project_manifest/tools/assemble.py \
            project_manifest/${{ matrix.appliance }}/container_def.yml \
            project_manifest/${{ matrix.appliance }}/staging

      - name: Generate Appliance SBOM
        # ... unchanged from your existing workflow

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── BUILD (local only, no push) ─────────────────────────────────────
      - name: Build Appliance Container
        id: build
        uses: docker/build-push-action@v7
        with:
          context: project_manifest/${{ matrix.appliance }}
          file: project_manifest/${{ matrix.appliance }}/Dockerfile
          push: false        # ← local only
          load: true         # ← loads into local docker daemon
          build-args: |
            STAGING_DIR=staging
            BR_TAG=${{ env.BR_TAG }}
          tags: |
            validate-target:${{ matrix.appliance }}

      # ── VALIDATE ────────────────────────────────────────────────────────
      - name: Install eBPF Hook Scripts
        run: |
          sudo cp ci/hooks/attach-ebpf-probe /usr/local/bin/
          sudo cp ci/hooks/detach-ebpf-probe /usr/local/bin/
          sudo chmod +x /usr/local/bin/attach-ebpf-probe
          sudo chmod +x /usr/local/bin/detach-ebpf-probe
          sudo mkdir -p /var/run/ebpf-hooks
          sudo chmod 700 /var/run/ebpf-hooks
          sudo touch /var/log/ebpf-container-trace.log
          sudo chmod 666 /var/log/ebpf-container-trace.log

      - name: Build OCI Bundle from Image
        run: |
          sudo python3 ci/hooks/build-oci-bundle.py \
            validate-target:${{ matrix.appliance }} \
            /tmp/oci-bundle

      - name: Run Container via runc
        run: |
          sudo runc run \
            --bundle /tmp/oci-bundle \
            validate-${{ matrix.appliance }}-${{ github.run_id }}

      - name: Generate Dependency Report
        run: |
          python3 ci/hooks/generate-report.py \
            --log /var/log/ebpf-container-trace.log \
            --manifest project_manifest/${{ matrix.appliance }}/container_def.yml \
            --no-color
        # Exit code 1 if undeclared dependencies found — blocks push step

      # ── PUSH ────────────────────────────────────────────────────────────
      - name: Push Appliance Container
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: project_manifest/${{ matrix.appliance }}
          file: project_manifest/${{ matrix.appliance }}/Dockerfile
          push: true
          provenance: false
          build-args: |
            STAGING_DIR=staging
            BR_TAG=${{ env.BR_TAG }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.appliance }}:${{ env.BR_TAG }}
            ghcr.io/${{ github.repository }}/${{ matrix.appliance }}:latest
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=A minimal JustEnough ${{ matrix.appliance }} appliance
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Appliance Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.appliance }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true

